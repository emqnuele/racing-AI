[project]
name = "racing-ai"
version = "0.1.0"
description = "Neuroevolution: a car that learns to drive on procedurally generated tracks it has never seen"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pygame>=2.6",
    "matplotlib>=3.9",
]

[project.scripts]
racing = "racing_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racing_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
